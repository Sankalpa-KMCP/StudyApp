name: CI

on:
  push:
    branches: [V2, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Pin npm
        run: npm install -g npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Bundle size budget
        run: npm run check:bundle

      - name: Verify dist output
        run: |
          test -f dist/index.html
          grep -q '/StudyApp/assets/' dist/index.html
          ! grep -q 'main.tsx' dist/index.html

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright E2E
        run: npm run test:e2e

      # Preserve the exact post-check dist for Pages; skip on pull requests and non-deploy branches.
      - name: Upload checked dist artifact
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-dist
          path: dist
          retention-days: 1

      - name: Staging root build
        if: github.event_name == 'push' && github.ref == 'refs/heads/V2'
        run: npm run build -- --base=/

      - name: Verify staging dist output
        if: github.event_name == 'push' && github.ref == 'refs/heads/V2'
        run: |
          test -f dist/_redirects
          [ "$(cat dist/_redirects | tr -d '\r')" = "/* /index.html 200" ]
          test -f dist/index.html
          grep -q 'src="/assets/' dist/index.html
          grep -q 'href="/manifest.webmanifest"' dist/index.html
          grep -q 'src="/registerSW.js"' dist/index.html
          ! grep -q '/StudyApp/' dist/index.html

      - name: Create staging deployment metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/V2'
        run: |
          cat << EOF > dist/staging-build.json
          {
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "runId": "${GITHUB_RUN_ID}"
          }
          EOF

      - name: Upload staging dist artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/V2'
        uses: actions/upload-artifact@v4
        with:
          name: netlify-staging-dist
          path: dist
          retention-days: 1

  deploy-staging:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/V2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: staging
    concurrency:
      group: staging
      cancel-in-progress: true
    steps:
      - name: Download staging dist artifact
        uses: actions/download-artifact@v4
        with:
          name: netlify-staging-dist
          path: dist

      - name: Verify staging artifact integrity
        run: |
          test -f dist/staging-build.json
          test -f dist/_redirects
          [ "$(cat dist/_redirects | tr -d '\r')" = "/* /index.html 200" ]
          test -f dist/index.html
          grep -q 'src="/assets/' dist/index.html
          ! grep -q '/StudyApp/' dist/index.html
          META_COMMIT=$(node -e 'console.log(require("./dist/staging-build.json").commit)')
          META_REF=$(node -e 'console.log(require("./dist/staging-build.json").ref)')
          if [ "$META_COMMIT" != "$GITHUB_SHA" ]; then
            echo "Error: Metadata commit mismatch ($META_COMMIT != $GITHUB_SHA)"
            exit 1
          fi
          if [ "$META_REF" != "refs/heads/V2" ]; then
            echo "Error: Metadata ref mismatch ($META_REF != refs/heads/V2)"
            exit 1
          fi

      - name: Deploy to Netlify staging
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@27.0.1 deploy --dir=dist --prod

  deploy:
    needs: check
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Download checked dist artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages-dist
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
