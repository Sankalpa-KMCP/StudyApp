name: CI

on:
  push:
    branches: [V2, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Pin npm
        run: npm install -g npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Bundle size budget
        run: npm run check:bundle

      - name: Verify dist output
        run: |
          test -f dist/index.html
          grep -q '/StudyApp/assets/' dist/index.html
          ! grep -q 'main.tsx' dist/index.html

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright E2E
        run: npm run test:e2e

      # Preserve the exact post-check dist for Pages; skip on pull requests and non-deploy branches.
      - name: Upload checked dist artifact
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-dist
          path: dist
          retention-days: 1

  deploy:
    needs: check
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Download checked dist artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages-dist
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Verify master tip freshness
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_MASTER_SHA=$(gh api repos/${{ github.repository }}/commits/master --jq .sha)
          echo "Current remote master SHA: ${CURRENT_MASTER_SHA}"
          echo "Workflow run commit SHA:  ${{ github.sha }}"
          if [ -z "${CURRENT_MASTER_SHA}" ]; then
            echo "::error::Could not resolve remote master SHA."
            exit 1
          fi
          if [ "${CURRENT_MASTER_SHA}" = "${{ github.sha }}" ]; then
            echo "is_current_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current_tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Pages deployment because workflow SHA ${{ github.sha }} is not the current remote master tip (${CURRENT_MASTER_SHA})."
          fi

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.is_current_tip == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
