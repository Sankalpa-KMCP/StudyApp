<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        var search = l.search;
        if (search && search.indexOf('_p=') !== -1) {
          var params = {};
          var pairs = search.slice(1).split('&');
          var restOfQuery = [];
          for (var i = 0; i < pairs.length; i++) {
            var pair = pairs[i].split('=');
            var key = pair[0];
            var val = pair.slice(1).join('=').replace(/~and~/g, '&');
            if (key === '_p') {
              params._p = val;
            } else {
              // 404.html transports the original encoded query, replacing only
              // delimiters. Preserve escapes, flags, and repeated keys verbatim.
              restOfQuery.push(pairs[i].replace(/~and~/g, '&'));
            }
          }
          if (params._p !== undefined) {
            var base = l.pathname;
            if (base.slice(-1) !== '/') {
              base += '/';
            }
            var newPath = base + params._p;
            newPath = newPath.replace(/\/+/g, '/');
            if (l.protocol !== 'file:') {
              var newSearch = restOfQuery.length > 0 ? ('?' + restOfQuery.join('&')) : '';
              window.history.replaceState(null, null, newPath + newSearch + l.hash);
            }
          }
        }
      }(window.location));
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Local-first focus and study tracking dashboard" />
    <title>Study Dashboard</title>
    <style>
      #app-preloader {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0c0d0e;
      }
      .preloader-spinner {
        width: 32px;
        height: 32px;
        box-sizing: border-box;
        border: 2.5px solid rgba(255, 255, 255, 0.12);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: preloaderSpin 0.75s linear infinite;
      }
      @keyframes preloaderSpin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-preloader" aria-hidden="true">
        <div class="preloader-spinner"></div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
